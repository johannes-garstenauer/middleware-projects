# Log4j 2 Configuration for ZAB
# Root logger configuration: log level and appenders
rootLogger = DEBUG, CONSOLE, FILE

# Console Appender Configuration
appender.CONSOLE.name = CONSOLE
appender.CONSOLE.type = Console
appender.CONSOLE.layout.type = PatternLayout
appender.CONSOLE.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n

# File Appender Configuration
appender.FILE.name = FILE
appender.FILE.type = File
appender.FILE.fileName = zab.log
appender.FILE.layout.type = PatternLayout
appender.FILE.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n

# Logger configuration for ZAB package
logger.zab.name = org.apache.zookeeper.zab
logger.zab.level = INFO
logger.zab.additivity = false
logger.zab.appenderRef.console.ref = CONSOLE
logger.zab.appenderRef.file.ref = FILE

# Logger configuration for MWZooKeeper package
logger.mwzk.name = mw.zookeeper
logger.mwzk.level = DEBUG
logger.mwzk.additivity = false
logger.mwzk.appenderRef.console.ref = CONSOLE
logger.mwzk.appenderRef.file.ref = FILE
